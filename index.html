<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMLE FİLTRE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9; /* Sayfa arka planı */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 360px;
            width: 90%;
            margin: 20px auto;
        }
        .logo-img {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #0b5087; /* Sitedeki ana mavi tonu */
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            line-height: 1.3;
            font-weight: 700;
        }
        p {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .section-title {
            font-size: 13px;
            color: #0b5087; /* Şube başlıkları kurumsal mavi yapıldı */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 12px;
            text-align: left;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 5px;
            font-weight: 700;
        }
        .btn {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        /* Web sitesindeki orijinal tonlara göre buton renkleri */
        .btn-call { 
            background-color: #0081c9; /* Sitedeki üst bar canlı mavi rengi */
        }       
        .btn-maps { 
            background-color: #0c426e; /* Sitedeki logo arkası koyu lacivert rengi */
        } 
        .btn-web { 
            background-color: #1c2d3d; /* Antrasit/Koyu ton */
        }        
        .btn-instagram { 
            background-color: #e1306c; /* Orijinal Instagram Pembe/Kırmızı tonu */
        }  
    </style>
</head>
<body>

<div class="container">
    <img src="hamle-logo.png" alt="HAMLE FİLTRE LOGO" class="logo-img">
    
    <h1>HAMLE FİLTRE</h1>
    <p>İş Makinaları & Ağır Vasıta Filtreleri</p>
    
    <div class="section-title">📍 Gaziantep Merkez</div>
    
    <a href="tel:+905444078833" class="btn btn-call">📞 Merkez Ofis Ara</a>
    
    <a href="https://www.google.com/maps/dir/37.0802688,37.3161984/Hamle+Filtre,+Sanayi,+Anafartalar+Cd.+No:158,+27110+%C5%9Eehitkamil%2FGaziantep/@37.0907531,37.2944381,12z/data=!4m10!4m9!1m1!4e1!1m5!1m1!1s0x1531e5e74ddeb177:0x694dbb40dcce56e0!2m2!1d37.4390417!2d37.0706501!3e0?entry=ttu&g_ep=EgoyMDI2MDUxMy4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="btn btn-maps">🗺️ Merkez Yol Tarifi</a>
    
    
    <div class="section-title">📍 Mersin Şube</div>
    
    <a href="tel:+905437458833" class="btn btn-call">📞 Mersin Şube Ara</a>
    
    <a href="https://www.google.com/maps/place/Aslan+Filtre/@36.8357753,34.6638274,17z/data=!3m1!4b1!4m6!3m5!1s0x1527f1e570265f9d:0x11097eeca722f213!8m2!3d36.8357753!4d34.6638274!16s%2Fg%2F11s644t_18?hl=tr-TR&entry=ttu&g_ep=EgoyMDI2MDUxMy4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="btn btn-maps">🗺️ Mersin Yol Tarifi</a>
    
    
    <div class="section-title">🌐 Dijital Kanallarımız</div>
    
    <a href="https://www.hamlefilter.com/" target="_blank" class="btn btn-web">Web Sitemiz</a>
    
    <a href="https://www.instagram.com/hamlefiltre?igsh=MWdjcmxlZWtqbm8zMA==" target="_blank" class="btn btn-instagram">Instagram Profilimiz</a>
</div>

</body>
</html>
