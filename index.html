<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAMLE FİLTRE</title>

    <style>

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background-color: #f4f6f9; /* Sayfa arka planı */

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .container {

            background-color: #ffffff;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 8px 24px rgba(0,0,0,0.1);

            text-align: center;

            max-width: 360px;

            width: 90%;

            margin: 20px auto;

        }

        /* Logo boyutu isteğiniz üzerine büyütüldü */

        .logo-img {

            width: 200px; /* 140px'den 200px'e büyütüldü */

            height: auto;

            margin-bottom: 20px;

            border-radius: 8px;

        }

        h1 {

            color: #0b5087; /* Sitedeki ana mavi tonu */

            font-size: 24px;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            line-height: 1.3;

            font-weight: 700;

        }

        p {

            color: #555;

            font-size: 15px;

            margin-bottom: 25px;

            font-weight: 500;

        }

        .section-title {

            font-size: 12px;

            color: #8fa0af; /* Kurumsal gri-mavi tonu */

            text-transform: uppercase;

            letter-spacing: 1px;

            margin: 25px 0 12px;

            text-align: left;

            border-bottom: 2px solid #e1e8ed;

            padding-bottom: 5px;

            font-weight: 600;

        }

        .btn {

            display: block;

            color: white;

            text-decoration: none;

            padding: 14px;

            margin: 12px 0;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            transition: transform 0.1s, opacity 0.2s;

            box-shadow: 0 4px 6px rgba(0,0,0,0.08);

        }

        .btn:hover {

            opacity: 0.9;

        }

        .btn:active {

            transform: scale(0.98);

        }

        /* Web sitesindeki orijinal tonlara göre buton renkleri */

        .btn-call { 

            background-color: #0081c9; /* Sitedeki üst bar canlı mavi rengi */

        }       

        .btn-maps { 

            background-color: #0c426e; /* Sitedeki logo arkası koyu lacivert rengi */

        } 

        .btn-web { 

            background-color: #1c2d3d; /* Antrasit/Koyu ton */

        }        

        .btn-instagram { 

            background-color: #e1306c; /* Orijinal Instagram Pembe/Kırmızı tonu */

        }  

    </style>

</head>

<body>



<div class="container">

    <img src="hamle-logo.png" alt="HAMLE FİLTRE LOGO" class="logo-img">

    

    <h1>HAMLE FİLTRE</h1>

    <p>İş Makinaları & Ağır Vasıta Filtreleri</p>

    

    <div class="section-title">Hızlı İletişim & Ulaşım</div>

    

    <a href="tel:+905444078833" class="btn btn-call">📞 Yetkili Ara </a>

    

    <a href="https://www.google.com/maps?cid=7587926834445965024&g_mp=CiVnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLkdldFBsYWNlEAMYASAF&hl=tr-TR&source=embed">🗺️ Yol Tarifi / Yol Tarifi</a>

    

    <div class="section-title">Dijital Kanallarımız</div>

    

    <a href="https://www.hamlefilter.com/" target="_blank" class="btn btn-web">🌐 Web Sitemiz</a>

    

    <a href="https://www.instagram.com/hamlefiltre?igsh=MWdjcmxlZWtqbm8zMA==" target="_blank" class="btn btn-instagram">📸 Instagram Profilimiz</a>

</div>



</body>

</html>
